// Lean Otzarot reader app (Claude). Reuses the PDF engine modules of the MJ PDF fork. License: GPLv3.
plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.yeshsade.otzarot.reader'
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.yeshsade.otzarot.reader"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 78
        versionName "0.2.18-dev"
        testInstrumentationRunner "com.yeshsade.otzarot.reader.LeanProbe"
    }

    buildFeatures {
        buildConfig = true
    }

    packaging {
        jniLibs { useLegacyPackaging = true }
    }

    // The permanent release key never enters the repository: its details come from a file outside it, named by
    // the OTZAROT_SIGNING property or environment variable (owner, 2026-10-29). Without it, no release signing.
    def signingFile = System.getenv('OTZAROT_SIGNING') ?: (project.findProperty('OTZAROT_SIGNING') ?: '')
    def signing = new Properties()
    if (signingFile && file(signingFile).isFile()) file(signingFile).withInputStream { signing.load(it) }

    signingConfigs {
        if (signing.getProperty('storeFile')) {
            release {
                storeFile file(signing.getProperty('storeFile'))
                storePassword signing.getProperty('storePassword')
                keyAlias signing.getProperty('keyAlias')
                keyPassword signing.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            // not shrunk yet: the engine reaches the PDF library through native calls that shrinking can break,
            // and the release must behave exactly like the versions tested
            minifyEnabled false
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signing.getProperty('storeFile')) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.4.0"
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation project(':PdfiumAndroid')
    implementation project(':AndroidPdfViewer:android-pdf-viewer')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
